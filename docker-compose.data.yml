services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: habimas
      POSTGRES_USER: habimas
      POSTGRES_PASSWORD: habimas_local
    ports:
      - "5432:5432"
    volumes:
      - habimas_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habimas -d habimas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habimas_postgis:
